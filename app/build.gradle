plugins {
    id "com.android.application"
}

android {
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "androidx.core:core:1.6.0"
        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.nobi.alpine"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 4
        versionName "0.2.2"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.nobi.alpine"
        manifestPlaceholders.TERMUX_APP_NAME = "Nobi Alpine"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Nobi Alpine:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Nobi Alpine:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Nobi Alpine:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Nobi Alpine:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Nobi Alpine:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Nobi Alpine:Widget"

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        debug {
            def nobiAlpineKeystoreFile = System.getenv("NOBIALPINE_KEYSTORE_FILE")
            if (nobiAlpineKeystoreFile) {
                storeFile file(nobiAlpineKeystoreFile)
                storeType "PKCS12"
                keyAlias System.getenv("NOBIALPINE_KEY_ALIAS") ?: "nobialpine"
                storePassword System.getenv("NOBIALPINE_KEYSTORE_PASSWORD")
                keyPassword System.getenv("NOBIALPINE_KEY_PASSWORD")
            } else {
                storeFile file('dev_keystore.jks')
                keyAlias 'alias'
                storePassword 'xrj45yWGLbsO7W0v'
                keyPassword 'xrj45yWGLbsO7W0v'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("nobi-alpine_" + (apkVersionTag ? apkVersionTag : "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("nobi-alpine_" + (apkVersionTag ? apkVersionTag : "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.4"
}

def alpineAssetDir = new File(projectDir, "src/main/assets/alpine")
def alpineAssetFile = new File(alpineAssetDir, "alpine-minirootfs-3.24.3-aarch64.tar.gz")
def alpineChecksumFile = new File(alpineAssetDir, "alpine-minirootfs-3.24.3-aarch64.tar.gz.sha256")

// Downloads the pinned Alpine minirootfs + checksum into src/main/assets at
// build time and verifies the SHA-256 before the build proceeds. The 4 MB
// binary is deliberately kept OUT of git: the runner fetches it fresh on
// every build and the build FAILS on any checksum mismatch. If valid
// files are already present (e.g. a local rebuild), the download is skipped.
task downloadAlpineAssets {
    outputs.upToDateWhen { false }
    doLast {
        def alpineUrl = "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/alpine-minirootfs-3.24.3-aarch64.tar.gz"
        alpineAssetDir.mkdirs()

        // Checksum file first: its first token is the expected hash.
        def checksumConnection = new URL(alpineUrl + ".sha256").openConnection()
        checksumConnection.setInstanceFollowRedirects(true)
        checksumConnection.setRequestProperty("User-Agent", "NobiAlpine-build")
        checksumConnection.setConnectTimeout(30000)
        checksumConnection.setReadTimeout(30000)
        if (checksumConnection.getResponseCode() != 200) {
            throw new GradleException("Alpine checksum file returned HTTP " + checksumConnection.getResponseCode())
        }
        def checksumText = checksumConnection.getInputStream().getText("UTF-8")
        def expected = checksumText.trim().split("\\s+")[0].toLowerCase()
        if (expected.length() != 64) {
            throw new GradleException("Unexpected Alpine checksum format: " + checksumText.trim())
        }

        def toHexChecksum = { byte[] digestBytes ->
            def hex = new BigInteger(1, digestBytes).toString(16)
            while (hex.length() < 64) { hex = "0" + hex }
            return hex
        }

        if (alpineAssetFile.exists() && alpineChecksumFile.exists()) {
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            digest.update(alpineAssetFile.bytes)
            if (toHexChecksum(digest.digest()) == expected) {
                logger.quiet("Alpine asset already present with matching checksum, skipping download.")
                alpineChecksumFile.text = checksumText
                return
            }
            logger.quiet("Existing Alpine asset has a wrong hash, re-downloading.")
        }

        logger.quiet("Downloading " + alpineUrl + " ...")
        def connection = new URL(alpineUrl).openConnection()
        connection.setInstanceFollowRedirects(true)
        connection.setRequestProperty("User-Agent", "NobiAlpine-build")
        connection.setConnectTimeout(30000)
        connection.setReadTimeout(120000)
        if (connection.getResponseCode() != 200) {
            throw new GradleException("Alpine download returned HTTP " + connection.getResponseCode())
        }
        alpineAssetFile.withOutputStream { out ->
            out << connection.getInputStream()
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        digest.update(alpineAssetFile.bytes)
        def actual = toHexChecksum(digest.digest())
        if (actual != expected) {
            alpineAssetFile.delete()
            throw new GradleException("Alpine checksum mismatch: expected " + expected + ", actual " + actual)
        }
        alpineChecksumFile.text = checksumText
        logger.quiet("Alpine asset verified (" + alpineAssetFile.length() + " bytes, sha256 " + actual + ").")
    }
}

afterEvaluate {
    tasks.matching { Task task -> task.name.startsWith("merge") && task.name.endsWith("Assets") }.configureEach {
        dependsOn(downloadAlpineAssets)
    }
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}
